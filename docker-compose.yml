services:

  flask-app:
    build: .
    container_name: flask-app

    ports:
      - "5000:8000"

    environment:
      DB_NAME: flaskdb
      DB_USER: flaskuser
      DB_PASSWORD: 123
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      - postgres

  postgres:
    image: postgres:15

    container_name: postgres-db

    environment:
      POSTGRES_DB: flaskdb
      POSTGRES_USER: flaskuser
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"
